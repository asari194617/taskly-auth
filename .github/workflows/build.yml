name: build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/asari194617/taskly-auth:${{ github.sha }}
      - name: Save private image for production-host staging
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker pull ghcr.io/asari194617/taskly-auth:${{ github.sha }}
          docker save ghcr.io/asari194617/taskly-auth:${{ github.sha }} -o "$RUNNER_TEMP/taskly-auth-image.tar"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: taskly-auth-image-${{ github.sha }}
          path: ${{ runner.temp }}/taskly-auth-image.tar
          retention-days: 3
          compression-level: 0
