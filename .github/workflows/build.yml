name: build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest scripts/test_check_release_readiness.py
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_AUTH_API_URL: https://taskly-auth-api.iy0306.com
  mcp-oauth-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated_mcp_ci_root
          MYSQL_DATABASE: taskly_auth_mcp_test
          MYSQL_USER: mcp_test
          MYSQL_PASSWORD: isolated_mcp_ci_password
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run OAuth unit and real MySQL integration tests
        env:
          AUTH_MCP_TEST_DSN: mcp_test:isolated_mcp_ci_password@tcp(127.0.0.1:3306)/taskly_auth_mcp_test?parseTime=true&charset=utf8mb4&loc=UTC
        run: go test -race -count=1 -coverprofile=mcp-coverage.out ./...
      - name: Report and check MCP OAuth coverage
        run: python3 scripts/check-mcp-coverage.py mcp-coverage.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mcp-oauth-coverage
          path: |
            mcp-coverage.out
            mcp-coverage.md
            mcp-coverage.json
          retention-days: 7
  mcp-coverage-comment:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [mcp-oauth-integration]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      # The privileged reporting job never checks out or executes PR code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: mcp-oauth-coverage
          path: reports
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const source = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: source.number});
            if (current.state !== 'open' || current.head.sha !== source.head.sha) return;
            let result;
            try {
              if (fs.statSync('reports/mcp-coverage.json').size > 1024) throw new Error('Oversized report');
              result = JSON.parse(fs.readFileSync('reports/mcp-coverage.json', 'utf8'));
              for (const name of ['mcp', 'overall']) {
                if (typeof result[name] !== 'number' || !Number.isFinite(result[name]) || result[name] < 0 || result[name] > 100) throw new Error('Invalid coverage');
              }
            } catch { core.warning('Coverage report unavailable'); return; }
            const marker = '<!-- taskly-auth-mcp-coverage -->';
            const body = `${marker}\n### OAuth test coverage\n\n| Scope | Statements |\n| --- | ---: |\n| New MCP OAuth | ${result.mcp.toFixed(1)}% |\n| Complete Go module | ${result.overall.toFixed(1)}% |\n\nNew MCP OAuth requires 80%. Includes unit tests and real MySQL consent, PKCE, refresh, token exchange, and revocation tests.\n\nCommit: ${source.head.sha.slice(0, 7)}`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: source.number, per_page: 100});
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: source.number, body});
  oauth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start development auth service
        run: |
          cp .env.example .env
          sed -i 's|^OAUTH_PUBLIC_CLIENTS_JSON=.*|OAUTH_PUBLIC_CLIENTS_JSON=[{"client_id":"taskly-dev","redirect_uri":"http://127.0.0.1/callback"}]|' .env
          # The local smoke stack has no Taskly API; exercise its auth profile write separately.
          sed -i 's|^TASKLY_PROFILE_SYNC_URL=.*|TASKLY_PROFILE_SYNC_URL=|' .env
          docker compose up -d --wait db
          # Recreate an existing installation whose auth_sessions table predates
          # security step-up. The API must add the nullable column on startup.
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "ALTER TABLE auth_sessions DROP COLUMN security_verified_at"'
          # Existing login history predates IP, location, and device columns.
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "ALTER TABLE auth_login_history DROP COLUMN ip_address, DROP COLUMN geo_city, DROP COLUMN geo_region, DROP COLUMN geo_country, DROP COLUMN user_agent, DROP COLUMN ip_source, DROP COLUMN geo_source, DROP COLUMN geo_db_release, DROP COLUMN geo_db_sha256"'
          docker compose up -d --build auth ui
          for _attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3067/healthz && curl -fsS http://localhost:3068/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3067/healthz
          curl -fsS http://localhost:3068/login >/dev/null
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "DESCRIBE auth_sessions"' | grep -q '^security_verified_at[[:space:]]'
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "DESCRIBE auth_login_history"' | grep -q '^ip_address[[:space:]]'
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "DESCRIBE auth_login_history"' | grep -q '^user_agent[[:space:]]'
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "DESCRIBE auth_login_history"' | grep -q '^geo_db_sha256[[:space:]]'
      - name: Seed development account and exercise confidential and public clients
        env:
          AUTH_DSN: auth:auth_dev_password@tcp(127.0.0.1:3307)/taskly_auth?parseTime=true&charset=utf8mb4&loc=UTC
          AUTH_DEV_EMAIL: oauth-ci@example.test
          AUTH_DEV_PASSWORD: oauth-ci-password
          OAUTH_DEV_PUBLIC_CLIENT_ID: taskly-dev
          OAUTH_DEV_PUBLIC_REDIRECT_URI: http://127.0.0.1:8765/callback
        run: |
          go run ./cmd/seed-dev
          go test ./cmd/auth -run '^Test(EmailCodeLoginRecordsCurrentEmailVerification|LifecycleRestorationRequiresFreshLogin)$' -count=1
          python3 scripts/smoke-dev.py
      - name: Diagnose failed auth startup
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80 auth db ui
      - name: Stop development auth service
        if: always()
        run: docker compose down -v
  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, ui, oauth-smoke, mcp-oauth-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/asari194617/taskly-auth:${{ github.sha }}
      - name: Save private image for production-host staging
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker pull ghcr.io/asari194617/taskly-auth:${{ github.sha }}
          docker save ghcr.io/asari194617/taskly-auth:${{ github.sha }} -o "$RUNNER_TEMP/taskly-auth-image.tar"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: taskly-auth-image-${{ github.sha }}
          path: ${{ runner.temp }}/taskly-auth-image.tar
          retention-days: 3
          compression-level: 0
