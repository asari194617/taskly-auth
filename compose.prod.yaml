services:
  auth:
    image: ghcr.io/asari194617/taskly-auth:${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG to an immutable commit SHA}
    env_file:
      - path: .env.production
        format: raw
    environment:
      AUTH_ADDR: 0.0.0.0:3067
      NODE_ENV: production
      AUTH_MIGRATION_READY: ${AUTH_MIGRATION_READY:-0}
      AUTH_SECURITY_STEP_UP_REQUIRED: ${AUTH_SECURITY_STEP_UP_REQUIRED:-0}
    networks:
      - taskly
    ports:
      - "127.0.0.1:3070:3067"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3067/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  taskly:
    external: true
    name: infra_default
