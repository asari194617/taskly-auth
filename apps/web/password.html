<!doctype html>
<html lang="ja" class="ch-token-v2">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>パスワード | Taskly 認証</title><script type="module" src="/src/login.ts"></script></head>
  <body data-step="password"><main>
    <header class="page-header"><span class="brand">Taskly</span><label class="theme-control">テーマ <select data-theme-select aria-label="テーマ"><option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label></header>
    <p class="eyebrow">ログイン · 2 / 3</p><h1>パスワードを入力</h1>
    <p id="email-display" class="account-email"></p><a href="/login" class="back-link">メールアドレスを変更</a>
    <p id="error" class="message error" role="alert"></p>
    <form id="form"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required autofocus /><div class="actions"><button id="submit" type="submit">ログイン</button></div></form>
    <div class="alternative-actions"><p>別の方法でログイン</p><button id="send-code" class="secondary-button" type="button">メールコードを送信</button><button id="passkey" class="secondary-button" type="button">パスキーを使う</button></div>
    <p class="footer-note"><a data-taskly-login href="https://taskly.iy0306.com/login">従来のログイン画面</a></p>
  </main></body>
</html>
