<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskly 認証</title>
    <script type="module" src="/src/login.ts"></script>
  </head>
  <body>
    <main>
      <h1>Taskly にログイン</h1>
      <p id="error" class="message error" role="alert"></p>
      <form id="form">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required />
        <div id="primary">
          <label for="password">パスワード</label>
          <input id="password" type="password" autocomplete="current-password" />
          <p>パスワードを使わない場合は、下のコードを利用できます。</p>
        </div>
        <div id="secondary">
          <label for="code">メールコード</label>
          <input id="code" inputmode="numeric" autocomplete="one-time-code" />
          <button id="send-code" type="button">メールコードを送信</button>
          <label for="totp">認証アプリのコード</label>
          <input id="totp" inputmode="numeric" autocomplete="one-time-code" />
          <label for="recovery">復旧コード</label>
          <input id="recovery" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="submit" type="submit">ログイン</button>
          <button id="passkey" class="secondary-button" type="button">パスキーでログイン</button>
        </div>
      </form>
      <nav><a href="/security">認証設定</a><a href="/passkeys">パスキーを管理</a></nav>
      <p>認証できない場合は <a data-taskly-login href="https://taskly.iy0306.com/login">従来のログイン画面</a>を利用できます。</p>
    </main>
  </body>
</html>
