<!doctype html>
<html lang="ja" class="ch-token-v2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メールアドレス | Taskly 認証</title>
    <script type="module" src="/src/login.ts"></script>
  </head>
  <body data-step="email">
    <main>
      <header class="page-header"><span class="brand">Taskly</span><label class="theme-control">テーマ <select data-theme-select aria-label="テーマ"><option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label></header>
      <p class="eyebrow">ログイン · 1 / 3</p>
      <h1>メールアドレスを入力</h1>
      <p>Taskly のアカウントで続行します。</p>
      <p id="error" class="message error" role="alert"></p>
      <form id="form">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required autofocus />
        <div class="actions"><button id="submit" type="submit">次へ</button></div>
      </form>
      <nav><a href="/security">認証設定</a><a href="/passkeys">パスキーを管理</a></nav>
      <p class="footer-note">認証できない場合は <a data-taskly-login href="https://taskly.iy0306.com/login">従来のログイン画面</a>を利用できます。</p>
    </main>
  </body>
</html>
