# Keep the new WebAuthn origin unavailable until identity writes and passkey
# assertions are served by the separate auth database.
server {
    listen 80;
    server_name auth.taskly.iy0306.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.taskly.iy0306.com;
    ssl_certificate /etc/letsencrypt/live/auth.taskly.iy0306.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.taskly.iy0306.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Retry-After 3600 always;
    return 503 "Authentication UI is not available yet\n";
}
