# Install into /etc/nginx/conf.d/ (HTTP context) alongside the auth API vhost.
# Cloudflare's published edge networks, checked 2026-10-08:
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
# Refresh these networks when Cloudflare updates its published list.
geo $auth_cf_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Do not use client-provided X-Forwarded-For or CF-* headers on direct origin
# requests. Only a published Cloudflare edge may supply visitor metadata.
map "$auth_cf_edge:$http_cf_connecting_ip" $auth_history_ip {
    default $remote_addr;
    ~^1:.+ $http_cf_connecting_ip;
}
map "$auth_cf_edge:$http_cf_connecting_ip" $auth_history_source {
    default origin_socket;
    ~^1:.+ cloudflare;
}

# Keep location empty until Add visitor location headers is enabled in
# Cloudflare and an origin-side spoof test confirms it overwrites incoming
# client-supplied CF-IPCity/CF-Region/CF-IPCountry. Then set this value to 1.
map $host $auth_history_geo_enabled {
    default "";
    taskly-auth-api.iy0306.com 0;
}
map "$auth_history_source:$auth_history_geo_enabled" $auth_history_city {
    default "";
    cloudflare:1 $http_cf_ipcity;
}
map "$auth_history_source:$auth_history_geo_enabled" $auth_history_region {
    default "";
    cloudflare:1 $http_cf_region;
}
map "$auth_history_source:$auth_history_geo_enabled" $auth_history_country {
    default "";
    cloudflare:1 $http_cf_ipcountry;
}
