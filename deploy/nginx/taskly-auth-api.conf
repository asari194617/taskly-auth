server {
    server_name taskly-auth-api.iy0306.com;
    set $auth_history_proxy_token "";
    include /etc/nginx/snippets/taskly-auth-history-proxy-secret-*.conf;
    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @auth_unavailable;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Client-IP $auth_history_ip;
        proxy_set_header X-Auth-Proxy-Token $auth_history_proxy_token;
        proxy_set_header X-Auth-IP-Source $auth_history_source;
        proxy_set_header X-Auth-Geo-City $auth_history_city;
        proxy_set_header X-Auth-Geo-Region $auth_history_region;
        proxy_set_header X-Auth-Geo-Country $auth_history_country;
    }

    location @auth_unavailable {
        add_header Retry-After 3600 always;
        return 503 "Authentication API is not available yet\n";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/taskly-auth.iy0306.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taskly-auth.iy0306.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = taskly-auth-api.iy0306.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name taskly-auth-api.iy0306.com;
    return 404; # managed by Certbot


}
